<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{00-layout :: layout(~{::pageContent})}">
<body>
<th:block th:fragment="pageContent">
<th:block th:replace="~{00-op-bind-errors :: opBindErrors}" />
<script type="text/javascript" th:src="@{/static/js/snippets/dateTimePicker-past.js}"></script>
<script type="text/javascript" th:src="@{/static/js/snippets/periodTypeSelect.js}"></script>
<script type="text/javascript" th:src="@{/static/js/snippets/sortable.js}"></script>
<div class="content">
    <section><span>Installed Certificates</span></section>
    <form th:action="@{/manager/certificates/installed}" method="get" th:object="${params}">
        <table class="userInput">
            <tr>
                <td>ChargeBox ID:</td>
                <td><select th:field="*{chargeBoxId}">
                        <option value="" selected>All</option>
                        <option th:each="it : ${cpList}" th:value="${it}" th:text="${it}"></option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Certificate Type:</td>
                <td><select th:field="*{certificateType}">
                        <option value="" selected>All</option>
                        <option th:each="it : ${T(ocpp._2022._02.security.GetInstalledCertificateIds$CertificateUseEnumType).values()}" th:value="${{it}}" th:text="${it.value}"></option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><i>Responded At</i> Filter:</td>
                <td><select th:field="*{periodType}" id="periodTypeSelect">
                        <option th:each="it : ${T(de.rwth.idsg.steve.web.dto.QueryPeriodType).values()}" th:value="${{it}}" th:text="${it.value}"></option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>From:</td>
                <td><input type="text" th:field="*{from}" id="intervalPeriodTypeFrom" class="dateTimePicker"/></td>
            </tr>
            <tr>
                <td>To:</td>
                <td><input type="text" th:field="*{to}" id="intervalPeriodTypeTo" class="dateTimePicker"/></td>
            </tr>
            <tr>
                <td></td>
                <td id="add_space">
                    <input type="submit" value="Get">
                </td>
            </tr>
        </table>
    </form>
    <br>
    <table class="res action">
        <thead>
        <tr>
            <th data-sort="string">ChargeBox ID</th>
            <th data-sort="string">Certificate Type</th>
            <th data-sort="string">Hash Algorithm</th>
            <th data-sort="string">Issuer Name Hash</th>
            <th data-sort="string">Issuer Key Hash</th>
            <th data-sort="string">Serial Number</th>
            <th data-sort="date">Responded At</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
            <tr th:each="cert : ${certificates}">
                <td><a th:href="@{/manager/chargepoints/details/{pk}(pk=${cert.chargeBoxPk})}" th:text="${cert.chargeBoxId}"></a></td>
                <td th:text="${cert.certificateType}"></td>
                <td th:text="${cert.hashAlgorithm}"></td>
                <td th:text="${cert.issuerNameHash}"></td>
                <td th:text="${cert.issuerKeyHash}"></td>
                <td th:text="${cert.serialNumber}"></td>
                <td th:data-sort-value="${cert.respondedAt?.millis}" th:text="${cert.respondedAt}"></td>
                <td>
                    <form th:action="@{/manager/certificates/installed/{cb}/delete/{id}(cb=${cert.chargeBoxId},id=${cert.id})}" method="post"
                          th:with="connected=${connectedCpList.contains(cert.chargeBoxId)}">
                        <input th:disabled="${not connected}"
                               th:title="${connected} ? null : 'This certificate cannot be deleted, because the station is not connected at the moment.'"
                               type="submit"
                               class="redSubmit"
                               value="Delete"
                               onclick="return confirm('Are you sure you want to delete this certificate? It will delete the certificate at the station and then in database.');">
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</th:block>
</body>
</html>
