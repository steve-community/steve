<!--/* Thymeleaf counterpart of op-forms/TriggerMessageForm.jsp */-->
<form th:fragment="form" th:action="@{/manager/operations/{v}/TriggerMessage(v=${opVersion})}" method="post" th:object="${params}">
    <section><span th:text="|Charge Points with OCPP ${opVersion}|"></span></section>
    <th:block th:replace="~{00-cp-multiple :: cpMultiple}" />
    <section><span>Parameters</span></section>
    <table class="userInput">
        <tr>
            <td>Trigger Message:</td>
            <td>
                <select th:field="*{triggerMessage}">
                    <option th:each="it : ${T(de.rwth.idsg.steve.web.dto.ocpp.TriggerMessageEnum).values()}" th:value="${{it}}" th:text="${it}"></option>
                </select>
            </td>
        </tr>
        <tr>
            <td>Connector ID (integer):</td>
            <td><input type="text" th:field="*{connectorId}" placeholder="if empty, charge point as a whole"/></td>
        </tr>
        <tr>
            <td></td><td><div class="submit-button"><input type="submit" value="Perform"></div></td>
        </tr>
    </table>
</form>
