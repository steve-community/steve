<!--/* Form of the SendLocalList operation, shared by all OCPP versions that support it. Must be used where "params" and "opVersion" are in the model. */-->
<form th:fragment="form" th:action="@{/manager/operations/{v}/SendLocalList(v=${opVersion})}" method="post" th:object="${params}">
    <section><span th:text="|Charge Points with OCPP ${opVersion}|"></span></section>
    <th:block th:replace="~{00-cp-multiple :: cpMultiple}" />
    <section><span>Parameters</span></section>
    <table class="userInput sll">
        <tr><td>Hash (String):</td><td><i>Optional, omitted for now</i></td></tr>
        <tr><td>List Version (integer):</td><td><input type="text" th:field="*{listVersion}"/></td></tr>
        <tr><td>Update Type:</td>
            <td>
                <select th:field="*{updateType}">
                    <option th:each="it : ${T(ocpp.cp._2015._10.UpdateType).values()}" th:value="${{it}}" th:text="${it}"></option>
                </select>
            </td>
        </tr>
        <tr><td>Add/Update List:</td>
            <td>
                <select th:field="*{addUpdateList}" disabled="disabled" multiple="multiple">
                    <option th:each="it : ${idTagList}" th:value="${it}" th:text="${it}"></option>
                </select>
            </td>
        </tr>
        <tr><td>Delete List:</td>
            <td>
                <select th:field="*{deleteList}" disabled="disabled" multiple="multiple">
                    <option th:each="it : ${idTagList}" th:value="${it}" th:text="${it}"></option>
                </select>
            </td>
        </tr>
        <tr><td>Send empty list?:</td><td><input type="checkbox" th:field="*{sendEmptyListWhenFull}" id="sendEmptyListWhenFull"/></td></tr>
        <tr><td><i>
            If selected and the update type is <b>FULL</b>, an empty list will be sent.<br>
            As a result, the charge point will remove all idTags from its list.
        </i></td><td></td></tr>
        <tr><td></td><td><div class="submit-button"><input type="submit" value="Perform"></div></td></tr>
    </table>
</form>
