<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{00-layout :: layout(~{::pageContent})}">
<body>
<th:block th:fragment="pageContent">
<div class="content">
    <div>
        <section><span th:text="|GetConfigurationResponse from ${chargeBoxId}|"></span></section>
        <th:block th:if="${not #lists.isEmpty(response.unknownKeys)}">
            <div class="warning">
                <b>Unknown keys:</b> <th:block th:text="${response.unknownKeys}" />
            </div>
            <br>
        </th:block>
        <table class="res">
            <thead>
            <tr>
                <th>Key</th>
                <th>Value</th>
                <th>Read only?</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="element : ${response.configurationKeys}">
                <td th:text="${element.key}"></td>
                <td th:text="${element.value}"></td>
                <td th:text="${element.readonly}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</th:block>
</body>
</html>
