<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{00-layout :: layout(~{::pageContent})}">
<body>
<th:block th:fragment="pageContent">
<div class="error">
    <h3>Error:</h3>
    <p th:text="${exception}"></p>
    <th:block th:if="${exceptionCause != null}">
        <h3>Reason:</h3>
        <p th:text="${exceptionCause}"></p>
    </th:block>
    <br>
    <p>You can <a href="javascript:window.history.back()">go back</a> or, for more detail, <a th:href="@{/manager/log}">view the log</a></p>
</div>
</th:block>
</body>
</html>
