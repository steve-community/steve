<!--/* "Misc." section of the charge point add/details forms. Must be used inside a form with th:object. */-->
<table class="userInput" th:fragment="cpMisc">
    <thead><tr><th>Misc.</th><th></th></tr></thead>
    <tr><td>Description:</td><td><input type="text" th:field="*{description}"/></td></tr>
    <tr>
        <td>Admin Address:</td>
        <td>
            <input type="text" th:field="*{adminAddress}"/>
            <a target="_blank" th:if="${not #strings.isEmpty(cp?.chargeBox?.adminAddress)}" th:href="${cp.chargeBox.adminAddress}">Go</a>
        </td>
    </tr>

    <tr><td>Additional Note:</td><td><textarea th:field="*{note}"></textarea></td></tr>
</table>
