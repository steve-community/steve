<!--/* Thymeleaf counterpart of op-forms/InstallCertificateForm.jsp */-->
<form th:fragment="form" th:action="@{/manager/operations/{v}/InstallCertificate(v=${opVersion})}" method="post" th:object="${params}">
    <section><span th:text="|Charge Points with OCPP ${opVersion}|"></span></section>
    <th:block th:replace="~{00-cp-multiple :: cpMultiple}" />
    <section><span>Parameters</span></section>
    <table class="userInput">
        <tr>
            <td>Certificate Type:</td>
            <td>
                <select th:field="*{certificateType}">
                    <option th:each="it : ${T(ocpp._2022._02.security.InstallCertificate$CertificateUseEnumType).values()}" th:value="${{it}}" th:text="${it.value}"></option>
                </select>
            </td>
        </tr>
        <tr><td>Certificate (PEM encoded, X.509):</td><td><textarea th:field="*{certificate}"></textarea></td></tr>
        <tr><td></td><td><div class="submit-button"><input type="submit" value="Perform"></div></td></tr>
    </table>
</form>
