<!--/*
    Link to an external URL that comes from data (user input, DB, remote API).

    Escaping alone does not make such a URL safe: a value like "javascript:..." stays executable in an href.
    Therefore, the link is rendered only for http(s) URLs. Otherwise, nothing is rendered.

    url  : the URL to link to (may be null)
    label: the link text
*/-->
<th:block th:fragment="safeLink(url, label)"
          th:with="trimmedUrl=${url == null ? null : #strings.trim(url)},
                   lowerUrl=${trimmedUrl == null ? '' : #strings.toLowerCase(trimmedUrl)}">
    <a th:if="${#strings.startsWith(lowerUrl, 'http://') or #strings.startsWith(lowerUrl, 'https://')}"
       target="_blank" rel="noopener noreferrer" th:href="${trimmedUrl}" th:text="${label}"></a>
</th:block>
