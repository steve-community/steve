<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{00-layout :: layout(~{::pageContent})}">
<body>
<th:block th:fragment="pageContent">
<div class="content">
    <div th:with="schedule=${response.chargingSchedule}">
        <center>
            <table id='details' class='cpd'>
                <thead><tr><th>GetCompositeScheduleResponse</th><th></th></tr></thead>
                <tr><td>ChargeBox ID:</td><td th:text="${chargeBoxId}"></td></tr>
                <tr><td>Connector ID:</td><td th:text="${response.connectorId}"></td></tr>
                <tr><td>Schedule Start:</td><td th:text="${response.scheduleStart}"></td></tr>
                <tr><td>Duration (in seconds):</td><td th:text="${schedule?.duration}"></td></tr>
                <tr><td>Start Schedule:</td><td th:text="${schedule?.startSchedule}"></td></tr>
                <tr><td>Charging Rate Unit:</td><td th:text="${schedule?.chargingRateUnit}"></td></tr>
                <tr><td>Min Charging Rate:</td><td th:text="${schedule?.minChargingRate}"></td></tr>
            </table>
        </center>
        <br>
        <section><span>Schedule Periods</span></section>
        <table class="res">
            <thead>
            <tr>
                <th>Start Period (in sec)</th>
                <th>Power Limit (in amperes)</th>
                <th>Number Phases</th>
            </tr>
            </thead>
            <tbody>
                <tr th:each="element : ${schedule?.chargingSchedulePeriod}">
                    <td th:text="${element.startPeriod}"></td>
                    <td th:text="${element.limit}"></td>
                    <td th:text="${element.numberPhases}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</th:block>
</body>
</html>
