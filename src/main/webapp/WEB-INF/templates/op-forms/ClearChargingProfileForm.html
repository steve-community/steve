<!--/* Thymeleaf counterpart of op-forms/ClearChargingProfileForm.jsp */-->
<form th:fragment="form" th:action="@{/manager/operations/{v}/ClearChargingProfile(v=${opVersion})}" method="post" th:object="${params}">
    <section><span th:text="|Charge Points with OCPP ${opVersion}|"></span></section>
    <th:block th:replace="~{00-cp-multiple :: cpMultiple}" />
    <section><span>Parameters</span></section>
    <table class="userInput">
        <tr>
            <td>Filter Type:</td>
            <td><select th:field="*{filterType}">
                <option th:each="it : ${T(de.rwth.idsg.steve.web.dto.ocpp.ClearChargingProfileFilterType).values()}" th:value="${{it}}" th:text="${it}"></option>
            </select>
            </td>
        </tr>
        <tr>
            <td>Charging Profile ID:</td>
            <td><select th:field="*{chargingProfilePk}">
                <option th:each="it : ${profileList}" th:value="${it.chargingProfilePk}" th:text="${it.itemDescription}"></option>
            </select>
            </td>
        </tr>
        <tr>
            <td>Connector ID (integer):</td>
            <td><input type="text" th:field="*{connectorId}" placeholder="0 = charge point as a whole. Leave empty to not set."/></td>
        </tr>
        <tr>
            <td>Charging Profile Purpose:</td>
            <td>
                <select th:field="*{chargingProfilePurpose}">
                    <option value="" selected>-- Empty --</option>
                    <option th:each="it : ${T(ocpp.cp._2015._10.ChargingProfilePurposeType).values()}" th:value="${{it}}" th:text="${it}"></option>
                </select>
            </td>
        </tr>
        <tr><td>Stack Level (integer):</td><td><input type="text" th:field="*{stackLevel}"/></td></tr>
        <tr><td></td><td><div class="submit-button"><input type="submit" value="Perform"></div></td></tr>
    </table>
</form>
