<!--/* Thymeleaf counterpart of op-forms/GetCompositeScheduleForm.jsp */-->
<form th:fragment="form" th:action="@{/manager/operations/{v}/GetCompositeSchedule(v=${opVersion})}" method="post" th:object="${params}">
    <section><span th:text="|Charge Points with OCPP ${opVersion}|"></span></section>
    <th:block th:replace="~{00-cp-multiple :: cpMultiple}" />
    <section><span>Parameters</span></section>
    <table class="userInput">
        <tr>
            <td>Connector ID (integer):</td>
            <td><input type="text" th:field="*{connectorId}" placeholder="0 = charge point as a whole"/></td>
        </tr>
        <tr><td>Duration (in seconds):</td><td><input type="text" th:field="*{durationInSeconds}"/></td></tr>
        <tr><td>Charging Rate Unit:</td>
            <td>
                <select th:field="*{chargingRateUnit}">
                    <option value="" selected>-- Empty --</option>
                    <option th:each="it : ${T(ocpp.cp._2015._10.ChargingRateUnitType).values()}" th:value="${{it}}" th:text="${it}"></option>
                </select>
            </td>
        </tr>
        <tr><td></td><td><div class="submit-button"><input type="submit" value="Perform"></div></td></tr>
    </table>
</form>
