<!--/*
    Error box listing the validation errors of a form's model attribute.

    beanName : name of the model attribute whose BindingResult should be checked
    message  : optional text shown above the error list
    elementId: optional id of the error div (used by JS in some pages)
*/-->
<th:block th:fragment="bindErrors(beanName, message, elementId)"
          th:with="bindingResult=${#ctx.getVariable('org.springframework.validation.BindingResult.' + beanName)}">
    <div class="error" th:id="${elementId}" th:if="${bindingResult != null and bindingResult.hasErrors()}">
        <th:block th:if="${message != null}" th:text="${message}" />
        <ul>
            <li th:each="error : ${bindingResult.allErrors}" th:text="${error.defaultMessage}"></li>
        </ul>
    </div>
</th:block>

<th:block th:fragment="opBindErrors">
    <th:block th:replace="~{00-op-bind-errors :: bindErrors('params', null, null)}" />
</th:block>
