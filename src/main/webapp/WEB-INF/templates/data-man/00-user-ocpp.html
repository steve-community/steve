<!--/*
    Thymeleaf counterpart of 00-user-ocpp.jsp. Must be used inside a form with th:object.
    submitButtonName/submitButtonValue: name and label of the main submit button
*/-->
<table class="userInput" th:fragment="userOcpp(submitButtonName, submitButtonValue)">
    <thead><tr><th>OCPP ID Tags</th><th></th></tr></thead>
    <tbody>
    <tr>
        <td style="vertical-align:top">
            <input type="button" value="Select None" onClick="selectNone(document.getElementById('idTagList'))">
        </td>
        <td>
            <select th:field="*{idTagList}" size="5" multiple="multiple">
                <option th:each="it : ${idTagList}" th:value="${it}" th:text="${it}"></option>
            </select>
        </td>
    </tr>
    <tr><td></td>
        <td id="add_space">
            <input type="submit" th:name="${submitButtonName}" th:value="${submitButtonValue}">
            <input type="submit" name="backToOverview" value="Back to Overview">
        </td></tr>
    </tbody>
</table>
