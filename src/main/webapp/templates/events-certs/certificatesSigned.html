<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{00-layout :: layout(~{::pageContent})}">
<body>
<th:block th:fragment="pageContent">
<th:block th:replace="~{00-op-bind-errors :: opBindErrors}" />
<script type="text/javascript" th:src="@{/static/js/snippets/dateTimePicker-past.js}"></script>
<script type="text/javascript" th:src="@{/static/js/snippets/periodTypeSelect.js}"></script>
<script type="text/javascript" th:src="@{/static/js/snippets/sortable.js}"></script>
<div class="content">
    <section><span>Signed Certificates</span></section>
    <form th:action="@{/manager/certificates/signed}" method="get" th:object="${params}">
        <table class="userInput">
            <tr>
                <td>ChargeBox ID:</td>
                <td><select th:field="*{chargeBoxId}">
                    <option value="" selected>All</option>
                    <option th:each="it : ${cpList}" th:value="${it}" th:text="${it}"></option>
                </select>
                </td>
            </tr>
            <tr>
                <td>Serial Number:</td>
                <td><input type="text" th:field="*{serialNumber}"/></td>
            </tr>
            <tr>
                <td>Issuer Name:</td>
                <td><input type="text" th:field="*{issuerName}"/></td>
            </tr>
            <tr>
                <td>Subject Name:</td>
                <td><input type="text" th:field="*{subjectName}"/></td>
            </tr>
            <tr>
                <td>Organization Name:</td>
                <td><input type="text" th:field="*{organizationName}"/></td>
            </tr>
            <tr>
                <td>Accepted?:</td>
                <td><select th:field="*{accepted}">
                    <option th:each="it : ${T(de.rwth.idsg.steve.web.dto.BooleanType).values()}" th:value="${{it}}" th:text="${it.value}"></option>
                </select>
                </td>
            </tr>
            <tr>
                <td><i>Responded At</i> Filter:</td>
                <td><select th:field="*{periodType}" id="periodTypeSelect">
                        <option th:each="it : ${T(de.rwth.idsg.steve.web.dto.QueryPeriodType).values()}" th:value="${{it}}" th:text="${it.value}"></option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>From:</td>
                <td><input type="text" th:field="*{from}" id="intervalPeriodTypeFrom" class="dateTimePicker"/></td>
            </tr>
            <tr>
                <td>To:</td>
                <td><input type="text" th:field="*{to}" id="intervalPeriodTypeTo" class="dateTimePicker"/></td>
            </tr>
            <tr>
                <td></td>
                <td id="add_space">
                    <input type="submit" value="Get">
                </td>
            </tr>
        </table>
    </form>
    <br>
    <table class="res">
        <thead>
        <tr>
            <th data-sort="string">ChargeBox ID</th>
            <th data-sort="string">Serial Number</th>
            <th data-sort="string">Issuer Name</th>
            <th data-sort="string">Subject Name</th>
            <th data-sort="string">Org. Name</th>
            <th data-sort="date">Valid From</th>
            <th data-sort="date">Valid To</th>
            <th data-sort="string">Accepted?</th>
            <th data-sort="date">Responded At</th>
        </tr>
        </thead>
        <tbody>
            <tr th:each="cert : ${certificates}">
                <td><a th:href="@{/manager/chargepoints/details/{pk}(pk=${cert.chargeBoxPk})}" th:text="${cert.chargeBoxId}"></a></td>
                <td th:text="${cert.serialNumber}"></td>
                <td th:text="${cert.issuerName}"></td>
                <td th:text="${cert.subjectName}"></td>
                <td th:text="${cert.organizationName}"></td>
                <td th:data-sort-value="${cert.validFrom?.millis}" th:text="${cert.validFrom}"></td>
                <td th:data-sort-value="${cert.validTo?.millis}" th:text="${cert.validTo}"></td>
                <td th:text="${cert.accepted}"></td>
                <td th:data-sort-value="${cert.respondedAt?.millis}" th:text="${cert.respondedAt}"></td>
            </tr>
        </tbody>
    </table>
</div>
</th:block>
</body>
</html>
