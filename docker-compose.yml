version: "3.0"

volumes:
  db-data:
    external: false

networks:
  steve-net:
    driver: bridge

services:

  db:
    image: mariadb:10.11.16
    restart: unless-stopped
    # No host port binding: the app container reaches the db over the
    # steve-net network (as "mariadb", matching the hostname the app's
    # Dockerfile already waits on/connects to), and MariaDB doesn't need
    # to be reachable from outside the compose network.
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      TZ: +00:00
      MYSQL_DATABASE: stevedb
      MYSQL_USER: steve
      MYSQL_PASSWORD: changeme
    volumes:
      - db-data:/var/lib/mysql
    networks:
      steve-net:
        aliases:
          - mariadb

  app:
    restart: unless-stopped
    build: .
    volumes:
      - .:/code
    ports:
      - "8180:8180"
      - "8443:8443"
    depends_on:
      - db
    networks:
      - steve-net
