<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{00-layout :: layout(~{::pageContent})}">
<body>
<th:block th:fragment="pageContent">
<script type="text/javascript" th:src="@{/static/js/snippets/sortable.js}"></script>
<div class="content"><div>
<section><span>
Connection Status for JSON Charge Points
        <a class="tooltip" href="#"><img th:src="@{/static/images/info.png}" style="vertical-align:middle">
            <span>There can be multiple entries for a charge point.
                This indicates that charge point has opened more than one actual connection.</span>
        </a>
</span></section>
    <table class="res action">
        <thead>
            <tr>
                <th data-sort="string">ChargeBox ID</th>
                <th data-sort="string">OCPP Version</th>
                <th data-sort="date">Connected Since</th>
                <th data-sort="date">Connection Duration</th>
                <th data-sort="date">Last OCPP Message</th>
                <th data-sort="date">Last Pong</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="s : ${ocppJsonStatusList}">
                <td>
                    <a th:if="${s.chargeBoxPk != null}" th:href="@{/manager/chargepoints/details/{pk}(pk=${s.chargeBoxPk})}" th:text="${s.chargeBoxId}"></a>
                    <th:block th:unless="${s.chargeBoxPk != null}" th:text="${s.chargeBoxId}" />
                </td>
                <td th:text="${s.version?.value}"></td>
                <td th:data-sort-value="${s.connectedSinceDT?.millis}" th:text="${s.connectedSince}"></td>
                <td th:data-sort-value="${s.connectedSinceDT?.millis}" th:text="${s.connectionDuration}"></td>
                <td th:data-sort-value="${s.lastOcppMessageDT?.millis}" th:text="${s.lastOcppMessage}"></td>
                <td th:data-sort-value="${s.lastPongDT?.millis}" th:text="${s.lastPong}"></td>
                <td>
                    <form th:action="@{/manager/home/ocppJsonStatus/disconnect}" method="post">
                        <input type="hidden" name="version" th:value="${s.version}"/>
                        <input type="hidden" name="chargeBoxId" th:value="${s.chargeBoxId}"/>
                        <input type="hidden" name="sessionId" th:value="${s.sessionId}"/>
                        <input type="submit" class="redSubmit" value="Disconnect" title="Close this connection/session"/>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div></div>
</th:block>
</body>
</html>
