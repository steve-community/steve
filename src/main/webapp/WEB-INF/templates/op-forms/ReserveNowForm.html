<!--/* Thymeleaf counterpart of op-forms/ReserveNowForm.jsp */-->
<form th:fragment="form" th:action="@{/manager/operations/{v}/ReserveNow(v=${opVersion})}" method="post" th:object="${params}">
    <section><span th:text="|Charge Points with OCPP ${opVersion}|"></span></section>
    <th:block th:replace="~{00-cp-single :: cpSingle}" />
    <section><span>Parameters</span></section>
    <table class="userInput">
        <tr><td>Connector ID:</td>
            <td><select th:field="*{connectorId}" disabled="disabled"></select></td>
        </tr>
        <tr><td>Expiry Date/Time:</td>
            <td>
                <input type="text" th:field="*{expiry}" class="dateTimePicker" />
            </td>
        </tr>
        <tr><td>OCPP ID Tag:</td>
            <td>
                <select th:field="*{idTag}">
                    <option th:each="it : ${idTagList}" th:value="${it}" th:text="${it}"></option>
                </select>
            </td></tr>
        <tr><td></td><td><div class="submit-button"><input type="submit" value="Perform"></div></td></tr>
    </table>
</form>
