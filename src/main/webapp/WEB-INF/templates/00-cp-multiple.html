<!--/* Thymeleaf counterpart of 00-cp-multiple.jsp. Must be used inside a form with th:object. */-->
<th:block th:fragment="cpMultiple">
<table class="userInput">
    <tr>
        <td style="vertical-align:top">
            <input type="button" value="Select All" onClick="selectAll(document.getElementById('chargePointSelectList'))"><input type="button" value="Select None" onClick="selectNone(document.getElementById('chargePointSelectList'))">
        </td>
        <td>
            <select th:field="*{chargePointSelectList}" size="5" multiple="multiple">
                <option th:each="cp : ${cpList}"
                        th:value="|${cp.ocppProtocol};${cp.chargeBoxId};${cp.endpointAddress ?: ''}|"
                        th:text="${cp.chargeBoxId}"></option>
            </select>
        </td>
    </tr>
</table>
<br>
</th:block>
