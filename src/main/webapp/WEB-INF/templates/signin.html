<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" th:href="@{/static/images/favicon.ico}" type="image/x-icon" />
    <link rel="shortcut icon" th:href="@{/static/images/favicon.ico}" type="image/x-icon" />
    <link rel="stylesheet" type="text/css" th:href="@{/static/css/style.css}">
    <title>SteVe - Steckdosenverwaltung</title>
</head>
<body>
<div class="main">
<div class="top-banner"><div class="container"><a th:href="@{/manager/home}"><img th:src="@{/static/images/logo2.png}" height="80"></a></div></div>
<div class="top-menu"></div>
<div class="main-wrapper">
    <div class="error" th:if="${param.error != null}">Your name or password is incorrect.</div>
    <div class="content">
        <section><span>Sign In</span></section>
        <!--/* th:action adds the CSRF token as hidden input automatically */-->
        <form method="POST" th:action="@{/manager/signin}">
            <table class="userInput">
                <tr><td>Name:</td><td><input type="text" name="username" id="username" required /></td></tr>
                <tr><td>Password:</td><td><input type="password" name="password" id="password" required /></td></tr>
                <tr><td></td><td id="add_space"><input type="submit" value="Sign In"></td></tr>
            </table>
        </form>
    </div>
</div></div>
</body>
</html>
