<!--/* Thymeleaf counterpart of op-forms/RemoteStopTransactionForm.jsp */-->
<form th:fragment="form" th:action="@{/manager/operations/{v}/RemoteStopTransaction(v=${opVersion})}" method="post" th:object="${params}">
    <section><span th:text="|Charge Points with OCPP ${opVersion}|"></span></section>
    <th:block th:replace="~{00-cp-single :: cpSingle}" />
    <section><span>Parameters</span></section>
    <table class="userInput">
        <tr><td>ID of the Active Transaction:</td><td><select th:field="*{transactionId}" disabled="disabled"></select></td></tr>
        <tr><td></td><td><div class="submit-button"><input type="submit" value="Perform"></div></td></tr>
    </table>
</form>
