<!--/* "Address" section of the charge point and user forms. Must be used inside a form with th:object that has an "address" property. */-->
<table class="userInput" th:fragment="address" th:with="boundAddress=*{address}">
    <thead><tr><th>Address</th><th></th></tr></thead>
    <tr><td>Street:</td><td><input type="text" th:field="*{address.street}"/></td></tr>
    <tr><td>House Number:</td><td><input type="text" th:field="*{address.houseNumber}"/></td></tr>
    <tr><td>Zip code:</td><td><input type="text" th:field="*{address.zipCode}"/></td></tr>
    <tr><td>City:</td><td><input type="text" th:field="*{address.city}"/></td></tr>
    <tr><td>Country:</td><td><select th:field="*{address.country}">
        <option th:each="it : ${countryCodes}" th:value="${it.key}" th:text="${it.value}"></option>
    </select></td></tr>
    <tr><td>Latitude:</td><td><input type="text" th:field="*{address.latitude}"/></td></tr>
    <tr><td>Longitude:</td><td><input type="text" th:field="*{address.longitude}"/></td></tr>
    <tr><td>Time Zone:</td><td><select th:field="*{address.timeZone}">
        <option th:each="it : ${timeZones}" th:value="${it.key}" th:text="${it.value}"></option>
    </select></td></tr>

    <tr th:if="${boundAddress?.latitude != null and boundAddress?.longitude != null}">
        <td></td>
        <td><a target="_blank" th:href="|https://maps.google.com/?q=${boundAddress.latitude},${boundAddress.longitude}|">
            Show on Google Maps</a>
        </td>
    </tr>
</table>
