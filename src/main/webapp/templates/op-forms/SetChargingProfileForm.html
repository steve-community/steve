<!--/* Form of the SetChargingProfile operation, shared by all OCPP versions that support it. Must be used where "params" and "opVersion" are in the model. */-->
<form th:fragment="form" th:action="@{/manager/operations/{v}/SetChargingProfile(v=${opVersion})}" method="post" th:object="${params}">
    <section><span th:text="|Charge Points with OCPP ${opVersion}|"></span></section>
    <th:block th:replace="~{00-cp-multiple :: cpMultiple}" />
    <section><span>Parameters</span></section>
    <table class="userInput">
        <tr>
            <td>Charging Profile ID:</td>
            <td><select th:field="*{chargingProfilePk}">
                <option th:each="it : ${profileList}" th:value="${it.chargingProfilePk}" th:text="${it.itemDescription}"></option>
            </select>
            </td>
        </tr>
        <tr>
            <td>Connector ID (integer):</td>
            <td><input type="text" th:field="*{connectorId}" placeholder="0 = charge point as a whole"/></td>
        </tr>
        <tr>
            <td>Transaction ID (integer):</td>
            <td><input type="text" th:field="*{transactionId}" placeholder="only necessary for TxProfile"/></td>
        </tr>
        <tr><td></td><td><div class="submit-button"><input type="submit" value="Perform"></div></td></tr>
    </table>
</form>
