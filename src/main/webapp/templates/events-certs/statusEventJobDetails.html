<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{00-layout :: layout(~{::pageContent})}">
<body>
<th:block th:fragment="pageContent">
<script type="text/javascript" th:src="@{/static/js/snippets/datePicker-past.js}"></script>
<div class="content"><div th:switch="${eventType}">
    <th:block th:case="'FirmwareUpdate'">
        <section><span>Firmware Update Job Details</span></section>
        <table class="userInput">
            <tr><td>Job/Request ID:</td><td><a th:href="@{/manager/events/status(eventType=${eventType},jobId=${details.jobId})}" th:text="${details.jobId}"></a></td></tr>
            <tr><td>Created at:</td><td th:text="${details.createdAt}"></td></tr>
            <tr><td>Location:</td><td th:text="${details.firmwareLocation}"></td></tr>
            <tr><td>Retrieve Date/Time:</td><td th:text="${details.retrieveDatetime}"></td></tr>
            <tr><td>Install Date/Time:</td><td th:text="${details.installDatetime}"></td></tr>
            <tr><td>Signature:</td><td th:text="${details.signature}"></td></tr>
            <tr><td>Signing Certificate:</td><td th:text="${details.signingCertificate}"></td></tr>
        </table>
    </th:block>
    <th:block th:case="'LogUpload'">
        <section><span>Log Upload Job Details</span></section>
        <table class="userInput">
            <tr><td>Job/Request ID:</td><td><a th:href="@{/manager/events/status(eventType=${eventType},jobId=${details.jobId})}" th:text="${details.jobId}"></a></td></tr>
            <tr><td>Created at:</td><td th:text="${details.createdAt}"></td></tr>
            <tr><td>Log Type:</td><td th:text="${details.logType}"></td></tr>
            <tr><td>Remote Location:</td><td th:text="${details.remoteLocation}"></td></tr>
            <tr><td>Oldest timestamp:</td><td th:text="${details.oldestTimestamp}"></td></tr>
            <tr><td>Latest timestamp:</td><td th:text="${details.latestTimestamp}"></td></tr>
        </table>
    </th:block>
    <!--/* We should not go into this branch */-->
    <th:block th:case="*">
        Something went wrong.
    </th:block>
</div></div>
</th:block>
</body>
</html>
