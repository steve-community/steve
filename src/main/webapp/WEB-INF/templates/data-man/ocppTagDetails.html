<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{00-layout :: layout(~{::pageContent})}">
<body>
<th:block th:fragment="pageContent">
<script type="text/javascript" th:src="@{/static/js/snippets/dateTimePicker-future.js}"></script>
<th:block th:replace="~{00-op-bind-errors :: bindErrors('ocppTagForm', 'Error while trying to update an OCPP tag:', null)}" />
<div class="content"><div>
    <section><span>OCPP Tag Details</span></section>

    <table class="userInput">
        <thead><tr><th>See Operations</th><th></th></tr></thead>
        <tbody>
        <tr>
            <td>Transactions:</td>
            <td>
                <a th:href="@{/manager/transactions/query(ocppIdTag=${ocppTagForm.idTag},type='ACTIVE')}">ACTIVE</a>
                /
                <a th:href="@{/manager/transactions/query(ocppIdTag=${ocppTagForm.idTag},type='ALL')}">ALL</a>
            </td>
        </tr>
        <tr>
            <td>Reservations:</td>
            <td>
                <a th:href="@{/manager/reservations/query(ocppIdTag=${ocppTagForm.idTag},periodType='ACTIVE')}">ACTIVE</a>
            </td>
        </tr>
        </tbody>
    </table>

    <form th:action="@{/manager/ocppTags/update}" method="post" th:object="${ocppTagForm}">

        <input type="hidden" th:field="*{ocppTagPk}" readonly="readonly"/>

        <th:block th:replace="~{data-man/00-ocppTag :: ocppTag(true, 'update', 'Update')}" />

    </form>
</div></div>
</th:block>
</body>
</html>
