<!--/* Left menu of OCPP 1.2 operation pages. activePage: name of the operation to highlight */-->
<div class="left-menu" th:fragment="menu(activePage)">
<ul>
    <li><a th:classappend="${activePage == 'ChangeAvailability'} ? highlight" th:href="@{/manager/operations/{v}/ChangeAvailability(v=${opVersion})}">Change Availability</a></li>
    <li><a th:classappend="${activePage == 'ChangeConfiguration'} ? highlight" th:href="@{/manager/operations/{v}/ChangeConfiguration(v=${opVersion})}">Change Configuration</a></li>
    <li><a th:classappend="${activePage == 'ClearCache'} ? highlight" th:href="@{/manager/operations/{v}/ClearCache(v=${opVersion})}">Clear Cache</a></li>
    <li><a th:classappend="${activePage == 'GetDiagnostics'} ? highlight" th:href="@{/manager/operations/{v}/GetDiagnostics(v=${opVersion})}">Get Diagnostics</a></li>
    <li><a th:classappend="${activePage == 'RemoteStartTransaction'} ? highlight" th:href="@{/manager/operations/{v}/RemoteStartTransaction(v=${opVersion})}">Remote Start Transaction</a></li>
    <li><a th:classappend="${activePage == 'RemoteStopTransaction'} ? highlight" th:href="@{/manager/operations/{v}/RemoteStopTransaction(v=${opVersion})}">Remote Stop Transaction</a></li>
    <li><a th:classappend="${activePage == 'Reset'} ? highlight" th:href="@{/manager/operations/{v}/Reset(v=${opVersion})}">Reset</a></li>
    <li><a th:classappend="${activePage == 'UnlockConnector'} ? highlight" th:href="@{/manager/operations/{v}/UnlockConnector(v=${opVersion})}">Unlock Connector</a></li>
    <li><a th:classappend="${activePage == 'UpdateFirmware'} ? highlight" th:href="@{/manager/operations/{v}/UpdateFirmware(v=${opVersion})}">Update Firmware</a></li>
</ul>
</div>
