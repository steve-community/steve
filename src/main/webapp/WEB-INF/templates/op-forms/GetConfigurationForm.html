<!--/* Thymeleaf counterpart of op-forms/GetConfigurationForm.jsp */-->
<form th:fragment="form" th:action="@{/manager/operations/{v}/GetConfiguration(v=${opVersion})}" method="post" th:object="${params}">
    <section><span th:text="|Charge Points with OCPP ${opVersion}|"></span></section>
    <th:block th:replace="~{00-cp-multiple :: cpMultiple}" />
    <section><span>Parameters</span></section>
    <table class="userInput">
        <tr><td style="vertical-align:top"><input type="button" value="Select All" onClick="selectAll(document.getElementById('confKeyList'))"><input type="button" value="Select None" onClick="selectNone(document.getElementById('confKeyList'))">
            <div class="info"><b>Info:</b> If none selected, the charge point returns a list of <b>all</b> configuration settings.</div>
        </td>
            <td>
                <select th:field="*{confKeyList}" multiple="multiple" size="14">
                    <option th:each="k : ${ocppConfKeys}" th:value="${k.key}" th:label="${k.value}" th:title="${k.value}" th:text="${k.value}"></option>
                </select>
            </td>
        </tr>
        <tr><td>Custom Configuration Keys:</td><td><input type="text" th:field="*{commaSeparatedCustomConfKeys}" placeholder="optional comma separated list" /></td></tr>
        <tr><td></td><td><div class="submit-button"><input type="submit" value="Perform"></div></td></tr>
    </table>
</form>
